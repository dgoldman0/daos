<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Uniswap v4 Liquidity Utility</title>
  <!-- Import web3.js from a CDN -->
  <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Uniswap v4 Liquidity Utility</h1>
  <div id="output">Connecting...</div>

  <script>
    // Ensure the user has a web3 wallet (e.g., MetaMask) installed.
    if (typeof window.ethereum !== 'undefined') {
      window.web3 = new Web3(window.ethereum);
      window.ethereum.request({ method: 'eth_requestAccounts' })
        .then(init)
        .catch(err => {
          document.getElementById('output').innerText = 'User denied account access.';
        });
    } else {
      document.getElementById('output').innerText = 'Please install MetaMask or another web3 wallet.';
    }

    // Hardcoded addresses and constants
    const tokenY = '0xf70bad81af569a6a0e6a0096530585606ac68725'; // Replace with your token Y address
    const USDC = '0xFF970A61A04b1cA14834A43f5de4533eBDDB5CC8'; // Arbitrum USDC address
    // Placeholder subgraph endpoint – update if necessary.
    const graphEndpoint = 'https://api.thegraph.com/subgraphs/name/uniswap/uniswap-v4-arbitrum';

    // Entry point after connecting to web3
    async function init() {
      document.getElementById('output').innerText = 'Fetching pool data...';
      try {
        const poolsData = await fetchPoolsForToken(tokenY);
        processPoolData(poolsData);
      } catch (err) {
        document.getElementById('output').innerText = 'Error fetching data: ' + err;
      }
    }

    // Fetch pools where token Y appears as token0 or token1 using a GraphQL query.
    async function fetchPoolsForToken(tokenAddress) {
      const query = `
      {
        pools0: pools(where: { token0: "${tokenAddress.toLowerCase()}" }) {
          id
          token0 { id, symbol, decimals }
          token1 { id, symbol, decimals }
          liquidity
          reserve0
          reserve1
        }
        pools1: pools(where: { token1: "${tokenAddress.toLowerCase()}" }) {
          id
          token0 { id, symbol, decimals }
          token1 { id, symbol, decimals }
          liquidity
          reserve0
          reserve1
        }
      }
      `;
      const response = await fetch(graphEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const json = await response.json();
      return json.data;
    }

    // Process the returned pool data, calculate totals, and update the UI.
    function processPoolData(data) {
      // Combine pools from both queries
      const pools = [...data.pools0, ...data.pools1];
      if (pools.length === 0) {
        document.getElementById('output').innerText = 'No pools found for token Y.';
        return;
      }

      let totalYAmount = 0; // Total token Y amount (assume 18 decimals)
      let totalLiquidityUSD = 0;
      let usdcYPool = null;
      let tableRows = '';

      pools.forEach(pool => {
        // Determine which token in the pool is token Y and which is the paired token.
        let otherToken, tokenYReserve;
        if (pool.token0.id.toLowerCase() === tokenY.toLowerCase()) {
          tokenYReserve = parseFloat(pool.reserve0);
          otherToken = pool.token1;
        } else {
          tokenYReserve = parseFloat(pool.reserve1);
          otherToken = pool.token0;
        }
        // Accumulate token Y amount, adjusting for decimals (assuming token Y has 18 decimals)
        totalYAmount += tokenYReserve / Math.pow(10, 18);

        // Identify the USDC-Y pool based on token addresses.
        if (
          (pool.token0.id.toLowerCase() === tokenY.toLowerCase() && pool.token1.id.toLowerCase() === USDC.toLowerCase()) ||
          (pool.token1.id.toLowerCase() === tokenY.toLowerCase() && pool.token0.id.toLowerCase() === USDC.toLowerCase())
        ) {
          usdcYPool = pool;
        }

        tableRows += `
          <tr>
            <td>${pool.id}</td>
            <td>${otherToken.symbol}</td>
            <td>${(tokenYReserve / Math.pow(10, 18)).toFixed(4)}</td>
            <td>${pool.liquidity}</td>
          </tr>
        `;
      });

      // Estimate token Y price using the USDC-Y pool's reserves.
      let tokenYPrice = 'N/A';
      if (usdcYPool) {
        let price;
        // If token0 is USDC, then token0 (USDC) / token1 (Y)
        if (usdcYPool.token0.id.toLowerCase() === USDC.toLowerCase()) {
          const usdcReserve = parseFloat(usdcYPool.reserve0) / Math.pow(10, 6); // USDC has 6 decimals
          const yReserve = parseFloat(usdcYPool.reserve1) / Math.pow(10, 18);
          price = usdcReserve / yReserve;
        } else {
          const usdcReserve = parseFloat(usdcYPool.reserve1) / Math.pow(10, 6);
          const yReserve = parseFloat(usdcYPool.reserve0) / Math.pow(10, 18);
          price = usdcReserve / yReserve;
        }
        tokenYPrice = price.toFixed(4);
        // Total liquidity in USD is estimated by multiplying total token Y by its price.
        totalLiquidityUSD = (totalYAmount * price).toFixed(2);
      }

      // Build HTML output.
      const html = `
        <h2>Pool Data for Token Y</h2>
        <p>Total Token Y across pools: ${totalYAmount.toFixed(4)}</p>
        <p>Estimated Token Y Price (from USDC-Y pool): ${tokenYPrice} USD</p>
        <p>Total Liquidity (based on token Y): ${totalLiquidityUSD} USD</p>
        <table>
          <thead>
            <tr>
              <th>Pool ID</th>
              <th>Other Token</th>
              <th>Token Y Reserve</th>
              <th>Liquidity (raw)</th>
            </tr>
          </thead>
          <tbody>
            ${tableRows}
          </tbody>
        </table>
        <p><em>Note: This example uses the current spot price from the USDC-Y pool. TWAP calculation can be added later.</em></p>
      `;
      document.getElementById('output').innerHTML = html;
    }
  </script>
</body>
</html>
